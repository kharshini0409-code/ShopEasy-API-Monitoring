spring.application.name=shopeasy-backend
server.port=8081

spring.datasource.url=${SHOPEASY_DB_URL:jdbc:postgresql://localhost:5432/api-monitor}
spring.datasource.username=${SHOPEASY_DB_USERNAME:postgres}
spring.datasource.password=${SHOPEASY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.error.include-message=always
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
